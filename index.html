<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaboIA - Physique Chimie Terminale</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a1a;
  --card: #1a1a2e;
  --card-hover: #22223a;
  --border: #2a2a4a;
  --text: #e0e0f0;
  --text-muted: #8888aa;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --chimie: #00b894;
  --physique: #0984e3;
  --transversal: #fdcb6e;
  --danger: #e17055;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* Header */
.header {
  background: linear-gradient(135deg, #0a0a1a 0%, #16213e 50%, #0a0a1a 100%);
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 1rem;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-light), #74b9ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.25rem;
  cursor: pointer;
}

.header p { color: var(--text-muted); font-size: 0.9rem; }

/* Main container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem 1rem;
}

/* Search */
.search-wrap { position: relative; margin-bottom: 1.25rem; }

.search-wrap svg {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);
}

#search {
  width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); color: var(--text);
  font-size: 1rem; outline: none; transition: border-color 0.2s;
}

#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-muted); }

/* Super-category toggles */
.super-toggles { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }

.super-btn {
  padding: 0.5rem 1.2rem; border: 2px solid var(--border); border-radius: 50px;
  background: transparent; color: var(--text-muted); font-size: 0.9rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}

.super-btn:hover { border-color: var(--text-muted); color: var(--text); }
.super-btn.active-chimie { border-color: var(--chimie); color: var(--chimie); background: rgba(0,184,148,0.1); }
.super-btn.active-physique { border-color: var(--physique); color: var(--physique); background: rgba(9,132,227,0.1); }
.super-btn.active-transversal { border-color: var(--transversal); color: var(--transversal); background: rgba(253,203,110,0.1); }

/* Filters row */
.filters { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }

.filter-select {
  padding: 0.5rem 0.85rem; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--text); font-size: 0.875rem;
  outline: none; cursor: pointer; min-width: 140px;
}

.filter-select:focus { border-color: var(--accent); }
.filter-select option { background: var(--card); color: var(--text); }

.btn-reset {
  padding: 0.5rem 1rem; border: 1px solid var(--danger); border-radius: 8px;
  background: transparent; color: var(--danger); font-size: 0.875rem;
  cursor: pointer; transition: all 0.2s; margin-left: auto;
}

.btn-reset:hover { background: var(--danger); color: #fff; }

/* Count */
.result-count { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; padding-left: 0.25rem; }
.result-count strong { color: var(--accent-light); }

/* Theme pills in filters */
.theme-filter-wrap { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.25rem; }

.theme-pill-filter {
  padding: 0.3rem 0.7rem; border-radius: 50px; font-size: 0.75rem; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); transition: all 0.2s; white-space: nowrap;
}

.theme-pill-filter:hover { border-color: var(--text-muted); color: var(--text); }
.theme-pill-filter.active { color: #fff; }

/* Cards grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.25rem; transition: all 0.25s; cursor: pointer;
  display: flex; flex-direction: column; gap: 0.75rem;
}

.card:hover {
  border-color: var(--accent); background: var(--card-hover);
  transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,92,231,0.15);
}

.card-title { font-size: 1.05rem; font-weight: 600; color: #fff; line-height: 1.4; }

.card-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

.meta-badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.78rem;
  font-weight: 500; background: rgba(255,255,255,0.06); color: var(--text-muted);
}

.meta-badge svg { width: 13px; height: 13px; }
.meta-badge.year { color: var(--accent-light); }
.meta-badge.location { color: #74b9ff; }
.meta-badge.points { color: #ffeaa7; }
.meta-badge.duration { color: #fab1a0; }

.card-themes { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: auto; }

.theme-pill {
  padding: 0.2rem 0.6rem; border-radius: 50px;
  font-size: 0.72rem; font-weight: 600; color: #fff;
}

/* No results */
.no-results { text-align: center; padding: 3rem 1rem; color: var(--text-muted); grid-column: 1 / -1; }
.no-results svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.4; }

/* ===== DETAIL VIEW ===== */
.detail-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg); z-index: 200; overflow-y: auto;
}

.detail-overlay.active { display: block; }

.detail-header {
  background: linear-gradient(135deg, #0a0a1a 0%, #16213e 50%, #0a0a1a 100%);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  display: flex; align-items: center; gap: 1rem;
  position: sticky; top: 0; z-index: 201; backdrop-filter: blur(10px);
}

.btn-back {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 0.5rem 1rem; cursor: pointer; font-size: 0.9rem;
  display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s;
  white-space: nowrap;
}

.btn-back:hover { border-color: var(--accent); background: var(--card-hover); }

.detail-header-title {
  font-size: 1.1rem; font-weight: 600; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.detail-content {
  max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem;
}

.detail-title {
  font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 1rem;
}

.detail-meta {
  display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem;
}

.detail-meta .meta-badge { font-size: 0.9rem; padding: 0.4rem 0.8rem; }

.detail-themes {
  display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem;
}

.detail-themes .theme-pill { font-size: 0.85rem; padding: 0.35rem 0.85rem; }

.detail-keywords {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 1.25rem; margin-bottom: 2rem;
}

.detail-keywords h3 { color: var(--accent-light); font-size: 0.95rem; margin-bottom: 0.5rem; }
.detail-keywords p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

/* Tab buttons for Sujet / Corrige */
.doc-tabs {
  display: flex; gap: 0.5rem; margin-bottom: 1rem;
}

.doc-tab {
  padding: 0.6rem 1.5rem; border: 2px solid var(--border); border-radius: 10px;
  background: transparent; color: var(--text-muted); font-size: 0.95rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}

.doc-tab:hover { border-color: var(--accent); color: var(--text); }
.doc-tab.active { border-color: var(--accent); background: var(--accent); color: #fff; }

.doc-tab.disabled {
  opacity: 0.4; cursor: not-allowed;
}

.exercise-content {
  background: #fff; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border); padding: 2rem 2.5rem;
  color: #1a1a2e; font-size: 0.95rem; line-height: 1.7;
  min-height: 300px;
}

.exercise-content h1, .exercise-content h2, .exercise-content h3 {
  color: #16213e; margin: 1.2em 0 0.5em;
}
.exercise-content p { margin: 0.6em 0; }
.exercise-content table {
  border-collapse: collapse; margin: 1em 0; width: 100%;
}
.exercise-content td, .exercise-content th {
  border: 1px solid #ccc; padding: 0.4em 0.8em; text-align: left;
}
.exercise-content th { background: #f0f0f5; font-weight: 600; }
.exercise-content img.exercise-img {
  display: block; max-width: 100%; margin: 1em auto;
  background: #eee; min-height: 60px; border-radius: 4px;
}
.exercise-content strong { color: #0a0a1a; }
.exercise-content em { font-style: italic; }
.exercise-content ul, .exercise-content ol { margin: 0.5em 0 0.5em 1.5em; }
.exercise-content li { margin: 0.3em 0; }

.exercise-loading {
  display: flex; align-items: center; justify-content: center;
  min-height: 300px; color: var(--text-muted);
}

.exercise-loading .spinner {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-right: 1rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.doc-unavailable {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; color: var(--text-muted); text-align: center; padding: 2rem;
}

.doc-unavailable svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.3; }

.fallback-viewer {
  background: #fff; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border); min-height: 500px;
}

.fallback-viewer iframe { width: 100%; height: 70vh; border: none; }

.source-link {
  display: inline-flex; align-items: center; gap: 0.4rem;
  color: var(--accent-light); font-size: 0.85rem; margin-top: 1rem;
  text-decoration: none; opacity: 0.6; transition: opacity 0.2s;
}

.source-link:hover { opacity: 1; }

/* Responsive */
@media (max-width: 600px) {
  .header h1 { font-size: 1.4rem; }
  .grid { grid-template-columns: 1fr; }
  .filters { gap: 0.5rem; }
  .filter-select { min-width: 0; flex: 1 1 120px; }
  .btn-reset { margin-left: 0; }
  .detail-title { font-size: 1.3rem; }
  .exercise-content { padding: 1rem 1.2rem; font-size: 0.9rem; }
}
</style>
</head>
<body>

<!-- ===== LIST VIEW ===== -->
<div id="listView">
  <div class="header">
    <h1 onclick="goHome()">LaboIA - Physique Chimie Terminale</h1>
    <p>Moteur de recherche d'exercices du Bac</p>
  </div>

  <div class="container">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Rechercher un exercice par mot-cl&eacute;...">
    </div>

    <div class="super-toggles">
      <button class="super-btn" data-cat="chimie" onclick="toggleSuper('chimie')">&#x1F9EA; Chimie</button>
      <button class="super-btn" data-cat="physique" onclick="toggleSuper('physique')">&#x269B;&#xFE0F; Physique</button>
      <button class="super-btn" data-cat="transversal" onclick="toggleSuper('transversal')">&#x1F4BB; Transversal</button>
    </div>

    <div class="filters">
      <select class="filter-select" id="filterYear">
        <option value="">Toutes les ann&eacute;es</option>
        <option value="2025">2025</option><option value="2024">2024</option>
        <option value="2023">2023</option><option value="2022">2022</option>
        <option value="2021">2021</option>
      </select>
      <select class="filter-select" id="filterLocation"><option value="">Tous les centres</option></select>
      <select class="filter-select" id="filterTheme"><option value="">Tous les th&egrave;mes</option></select>
      <button class="btn-reset" onclick="resetFilters()">Reinitialiser</button>
    </div>

    <div class="theme-filter-wrap" id="themePills"></div>
    <div class="result-count" id="resultCount"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ===== DETAIL VIEW ===== -->
<div class="detail-overlay" id="detailView">
  <div class="detail-header">
    <button class="btn-back" onclick="goHome()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Retour
    </button>
    <div class="detail-header-title" id="detailHeaderTitle"></div>
  </div>
  <div class="detail-content" id="detailContent"></div>
</div>

<script>
// Theme definitions
const THEMES = [
  "Acide-Base","Beer-Lambert","Kohlrausch","Spectroscopie",
  "Titrage conductim\u00e9trique","Titrage pH-m\u00e9trique","Cin\u00e9tique",
  "Piles - Constante \u00e9quilibre","Electrolyse","Synth\u00e8se organique",
  "2nde Loi Newton","Mouvement champ pesanteur","Mouvement champ \u00e9lectrique",
  "Satellites/Lois Kepler","Fluide","Thermodynamique","Diffraction",
  "Interf\u00e9rences","Effet Doppler","Lunette astronomique",
  "Effet photo\u00e9lectrique","Circuits RC","Intensit\u00e9 sonore","Python","Nucl\u00e9aire"
];

const CHIMIE = new Set(THEMES.slice(0, 10));
const PHYSIQUE = new Set([...THEMES.slice(10, 23), "Nucl\u00e9aire"]);
const TRANSVERSAL = new Set(["Python"]);

const PALETTE = [
  "#e17055","#00b894","#0984e3","#6c5ce7","#fdcb6e",
  "#e84393","#00cec9","#ff7675","#55efc4","#a29bfe",
  "#ffeaa7","#fab1a0","#81ecec","#74b9ff","#dfe6e9",
  "#fd79a8","#636e72","#2d3436","#b2bec3","#d63031",
  "#e17055","#00b894","#0984e3","#6c5ce7","#fdcb6e"
];
const THEME_COLORS = {};
THEMES.forEach((t, i) => THEME_COLORS[t] = PALETTE[i % PALETTE.length]);

function getThemeBg(theme) { return THEME_COLORS[theme] || '#6c5ce7'; }

// State
let exercises = [];
let docUrls = {};
let activeThemes = new Set();
let activeSuperCats = new Set();

// Load data
async function loadData() {
  try {
    const [exResp, docResp] = await Promise.all([
      fetch('data/exercises.json'),
      fetch('data/doc-urls.json').catch(() => null)
    ]);
    exercises = await exResp.json();
    if (docResp && docResp.ok) docUrls = await docResp.json();
    populateFilters();
    buildThemePills();
    render();
    // Check URL hash for direct exercise link
    if (location.hash) {
      const id = location.hash.slice(1);
      const ex = exercises.find(e => e.id === id);
      if (ex) showDetail(ex);
    }
  } catch (e) {
    document.getElementById('grid').innerHTML =
      '<div class="no-results"><p>Impossible de charger les exercices.</p></div>';
  }
}

function populateFilters() {
  const locations = [...new Set(exercises.map(e => e.location).filter(Boolean))].sort();
  const locSel = document.getElementById('filterLocation');
  locations.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    locSel.appendChild(opt);
  });
  const themeSel = document.getElementById('filterTheme');
  THEMES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    themeSel.appendChild(opt);
  });
}

function buildThemePills() {
  const wrap = document.getElementById('themePills');
  wrap.innerHTML = '';
  THEMES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'theme-pill-filter';
    btn.textContent = t;
    if (activeThemes.has(t)) {
      btn.classList.add('active');
      btn.style.background = getThemeBg(t);
      btn.style.borderColor = getThemeBg(t);
      btn.style.color = '#fff';
    }
    btn.addEventListener('click', () => {
      if (activeThemes.has(t)) activeThemes.delete(t);
      else activeThemes.add(t);
      document.getElementById('filterTheme').value = '';
      buildThemePills();
      render();
    });
    wrap.appendChild(btn);
  });
}

function toggleSuper(cat) {
  const btn = document.querySelector(`.super-btn[data-cat="${cat}"]`);
  if (activeSuperCats.has(cat)) {
    activeSuperCats.delete(cat);
    btn.classList.remove('active-' + cat);
    const set = cat === 'chimie' ? CHIMIE : cat === 'physique' ? PHYSIQUE : TRANSVERSAL;
    set.forEach(t => activeThemes.delete(t));
  } else {
    activeSuperCats.add(cat);
    btn.classList.add('active-' + cat);
    const set = cat === 'chimie' ? CHIMIE : cat === 'physique' ? PHYSIQUE : TRANSVERSAL;
    set.forEach(t => activeThemes.add(t));
  }
  buildThemePills();
  render();
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const year = document.getElementById('filterYear').value;
  const loc = document.getElementById('filterLocation').value;
  const themeDd = document.getElementById('filterTheme').value;

  return exercises.filter(ex => {
    if (q) {
      const haystack = (ex.title + ' ' + ex.themes.join(' ') + ' ' + ex.location + ' ' + ex.year).toLowerCase();
      const words = q.split(/\s+/);
      if (!words.every(w => haystack.includes(w))) return false;
    }
    if (year && ex.year !== parseInt(year)) return false;
    if (loc && ex.location !== loc) return false;
    if (themeDd && !ex.themes.includes(themeDd)) return false;
    if (activeThemes.size > 0) {
      if (!ex.themes.some(t => activeThemes.has(t))) return false;
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const grid = document.getElementById('grid');
  const count = document.getElementById('resultCount');

  count.innerHTML = `<strong>${filtered.length}</strong> exercice${filtered.length !== 1 ? 's' : ''} trouv\u00e9${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>
      <p>Aucun exercice ne correspond \u00e0 vos crit\u00e8res.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(ex => `
    <div class="card" onclick="openExercise('${ex.id}')">
      <div class="card-title">${ex.title}</div>
      <div class="card-meta">
        <span class="meta-badge year">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          ${ex.year}${ex.session ? ' - ' + ex.session : ''}
        </span>
        <span class="meta-badge location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${ex.location}
        </span>
        <span class="meta-badge points">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          ${ex.points} pts
        </span>
        <span class="meta-badge duration">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${ex.duration}
        </span>
      </div>
      <div class="card-themes">
        ${ex.themes.map(t => `<span class="theme-pill" style="background:${getThemeBg(t)}">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

// ===== DETAIL VIEW =====
function openExercise(id) {
  const ex = exercises.find(e => e.id === id);
  if (!ex) return;
  location.hash = id;
  showDetail(ex);
}

async function showDetail(ex) {
  document.getElementById('detailHeaderTitle').textContent = ex.title;

  // Show loading state first
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-title">${ex.title}</div>
    <div class="detail-meta">
      <span class="meta-badge year" style="font-size:0.95rem;padding:0.45rem 0.9rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        ${ex.year}${ex.session ? ' - ' + ex.session : ''}
      </span>
      <span class="meta-badge location" style="font-size:0.95rem;padding:0.45rem 0.9rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${ex.location}
      </span>
      <span class="meta-badge points" style="font-size:0.95rem;padding:0.45rem 0.9rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        ${ex.points} pts
      </span>
      <span class="meta-badge duration" style="font-size:0.95rem;padding:0.45rem 0.9rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        ${ex.duration}
      </span>
    </div>
    <div class="detail-themes">
      ${ex.themes.map(t => `<span class="theme-pill" style="background:${getThemeBg(t)}">${t}</span>`).join('')}
    </div>
    <div class="exercise-loading"><div class="spinner"></div>Chargement du contenu...</div>
  `;

  document.getElementById('detailView').classList.add('active');
  document.getElementById('listView').style.display = 'none';
  window.scrollTo(0, 0);

  // Load exercise content
  let content = null;
  try {
    const resp = await fetch('data/exercises/' + ex.id + '.json');
    if (resp.ok) content = await resp.json();
  } catch(e) {}

  const docs = docUrls[ex.id] || {};
  const hasSujetHtml = content && content.sujetHtml;
  const hasCorrigeHtml = content && content.correctionHtml;
  const hasSujetFallback = (content && content.sujetFallbackUrl) || docs.sujetUrl;
  const hasCorrigeFallback = (content && content.correctionFallbackUrl) || docs.correctionUrl;
  const hasSujet = hasSujetHtml || hasSujetFallback;
  const hasCorrige = hasCorrigeHtml || hasCorrigeFallback;

  // Build viewer
  const loading = document.querySelector('.exercise-loading');
  if (loading) loading.remove();

  const container = document.getElementById('detailContent');

  // Tabs
  const tabsHtml = `
    <div class="doc-tabs">
      <button class="doc-tab ${hasSujet ? 'active' : 'disabled'}" id="tabSujet" ${hasSujet ? "onclick=\"switchTab('sujet')\"" : ''}>
        Sujet
      </button>
      <button class="doc-tab ${!hasSujet && hasCorrige ? 'active' : ''} ${hasCorrige ? '' : 'disabled'}" id="tabCorrige" ${hasCorrige ? "onclick=\"switchTab('corrige')\"" : ''}>
        Corrig\u00e9
      </button>
    </div>
  `;

  // Content sections
  let viewerHtml = '<div id="docViewer">';

  // Sujet
  if (hasSujetHtml) {
    viewerHtml += '<div class="exercise-content" id="viewSujet">' + content.sujetHtml + '</div>';
  } else if (hasSujetFallback) {
    const url = (content && content.sujetFallbackUrl) || docs.sujetUrl;
    viewerHtml += '<div class="fallback-viewer" id="viewSujet"><iframe src="https://docs.google.com/gview?url=' + encodeURIComponent(url) + '&embedded=true" loading="lazy"></iframe></div>';
  }

  // Corrige
  if (hasCorrigeHtml) {
    viewerHtml += '<div class="exercise-content" id="viewCorrige" style="' + (hasSujet ? 'display:none' : '') + '">' + content.correctionHtml + '</div>';
  } else if (hasCorrigeFallback) {
    const url = (content && content.correctionFallbackUrl) || docs.correctionUrl;
    viewerHtml += '<div class="fallback-viewer" id="viewCorrige" style="' + (hasSujet ? 'display:none' : '') + '"><iframe src="https://docs.google.com/gview?url=' + encodeURIComponent(url) + '&embedded=true" loading="lazy"></iframe></div>';
  }

  if (!hasSujet && !hasCorrige) {
    viewerHtml += '<div class="doc-unavailable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15h6"/></svg><p>Documents en cours d\'ajout.</p></div>';
  }

  viewerHtml += '</div>';

  container.insertAdjacentHTML('beforeend', tabsHtml + viewerHtml);
}

function switchTab(tab) {
  const sujet = document.getElementById('viewSujet');
  const corrige = document.getElementById('viewCorrige');
  const tabS = document.getElementById('tabSujet');
  const tabC = document.getElementById('tabCorrige');

  if (tab === 'sujet' && sujet) {
    sujet.style.display = 'block';
    if (corrige) corrige.style.display = 'none';
    tabS.classList.add('active');
    tabC.classList.remove('active');
  } else if (tab === 'corrige' && corrige) {
    if (sujet) sujet.style.display = 'none';
    corrige.style.display = 'block';
    tabC.classList.add('active');
    tabS.classList.remove('active');
  }
}

function goHome() {
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('listView').style.display = 'block';
  history.replaceState(null, '', location.pathname);
}

// Handle back button
window.addEventListener('popstate', () => {
  if (!location.hash) goHome();
});

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('filterYear').value = '';
  document.getElementById('filterLocation').value = '';
  document.getElementById('filterTheme').value = '';
  activeThemes.clear();
  activeSuperCats.clear();
  document.querySelectorAll('.super-btn').forEach(b => b.className = 'super-btn');
  buildThemePills();
  render();
}

// Event listeners
document.getElementById('search').addEventListener('input', render);
document.getElementById('filterYear').addEventListener('change', render);
document.getElementById('filterLocation').addEventListener('change', render);
document.getElementById('filterTheme').addEventListener('change', render);

// Init
loadData();
</script>
</body>
</html>
